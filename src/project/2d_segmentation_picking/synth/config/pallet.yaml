# [BOX] 팔레트 디팔레타이징 합성 장면 설정
# 근거: research/README.md "2단계 결정" (사용자 확정 2026-10-29, 2026-11-03 갱신)

camera:
  model: zivid3_xl250
  width: 1408                  # 실측 zdf 해상도와 같음
  height: 1408
  # 핀홀 내부 파라미터 = 실측 점군 피팅 (u = fx·X/Z + cx 최소자승, 왜곡 효과 평균 흡수)
  #   출처: data/input/zivid3/20260304_AW2026_Zivid3_2.zdf (Zivid 3 XL250, SDK 2.18.0)
  #   참고: estimate_intrinsics 의 fx 2009.3 은 왜곡 계수와 짝인 값이라 핀홀 렌더에는 쓰지 않는다
  fx: 1986.9
  fy: 1994.0
  cx: 719.5
  cy: 701.5
  # 사용자 확정 (2026-11-03): 카메라는 지면에서 4.0 m, 정면 하향, 기울임·회전 없음.
  # 적재 최상단 상한 2.3 m → 작업거리 1.7 ~ 4.0 m.
  height_above_floor_m: 4.0
  # (a) 광학 중심이 이미지 중앙에서 벗어나 있으므로(cx 719.5 ≠ 704), 이 거리에서 팔레트 중심이
  #     이미지 중앙에 오도록 카메라를 옆으로 옮긴다 (약 13 mm). 1.7 m 에서 화면 폭 1.205 × 1.200 m.
  center_pallet_at_distance_m: 1.7
  tilt_deg_max: 0.0
  inplane_rot_deg: 0.0         # 회전 없음: 팔레트 변 = 이미지 축

pallet:
  size_m: [1.2, 1.2]           # 적재 최대 부피 1.2×1.2×2 m 에 맞춤
  height_m: 0.144

load:
  max_top_from_floor_m: 2.3    # 적재 최상단 상한 (지면 기준, 팔레트 포함). 적재 높이 상한 = 2.3 - 0.144
  min_layers: 1
  gap_m: [0.002, 0.015]        # 박스 사이 틈
  jitter_xy_m: 0.008
  jitter_yaw_deg: 1.5
  top_jitter_xy_m: 0.02        # 최상층은 더 흐트러짐
  top_jitter_yaw_deg: 4.0
  # 공통 목표 높이 ~ 균등분포(1층 ~ 상한): 작업거리 1.7~4.0 m 전 구간을 고르게 덮는다
  top_remove_frac: [0.0, 0.5]  # 디팔레타이징 진행 정도
  sweep_remove_prob: 0.5       # 제거를 한쪽부터 순서대로(sweep) vs 무작위

boxes:                         # L, W, H (m) — 사용자 확정 (2026-11-03): 택배 상자 1~5호 전부
  B1: [0.22, 0.19, 0.09]       # 1호
  B2: [0.27, 0.18, 0.15]       # 2호
  B3: [0.34, 0.25, 0.21]       # 3호
  B4: [0.41, 0.31, 0.28]       # 4호 (출처 미확인 표기, 사용자가 그대로 사용 결정)
  B5: [0.48, 0.38, 0.34]       # 5호
n_types_max: 3                 # 장면당 박스 종류 수 1~3 (5종 중 선택)
box_bevel_m: 0.003

render:
  samples: 64
  noise_threshold: 0.05
  denoiser: OPTIX
  device: OPTIX

lights:
  ambient: [0.05, 0.35]
  n_ceiling: [1, 3]
  ceiling_height: 7.0
  ceiling_spread: 2.5
  ceiling_size: 2.0
  ceiling_energy: [150, 600]
  coaxial_prob: 0.7
  coaxial_energy: [40, 200]

min_visible_px: 150
