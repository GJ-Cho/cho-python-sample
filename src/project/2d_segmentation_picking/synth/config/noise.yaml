# 합성 장면에 Zivid 유사 센서 노이즈를 입히는 후처리 설정 (add_sensor_noise.py)
# 원본(깨끗한) 데이터는 건드리지 않는다. 학습 시 on-the-fly 또는 별도 폴더로 출력.
#
# 근거 표기: [실측] = 이 리그에서 잰 값, [가정] = 근거 없는 초기값 → 실측 zdf로 교정 필요

cameras:
  zivid2plus_mr130:
    depth_ref_m: 1.193
    # [실측] 9×9 평면 잔차 0.02~0.05 mm @ 1.0~1.5 m (00~12.zdf, Zivid 필터 적용 후) → mm 양자화(σ 0.29)보다 작다
    depth_sigma_hf_mm: 0.05
    # [실측 상한] 바닥 평면 RANSAC rms 0.488 mm (평탄도 오차 포함) → 저주파 성분으로 넣는다
    depth_sigma_lf_mm: 0.3
    # [실측] 결측 구간 폭 역산 기선 중앙값 0.045 m, 그림자는 가리는 물체의 왼쪽 (+x 쪽 프로젝터)
    projector_baseline_x_m: 0.05
    # [실측 맞춤] 4 px 인접 법선 각도차 중앙값 실측 1.3~2.2°
    normals_jitter_deg: 0.8
  zivid3_xl250:
    depth_ref_m: 2.5
    # [실측] 9×9 평면 잔차 0.11~0.15 mm @ 2~3.5 m (Zivid3_2/3.zdf, 보정판 0.09~0.11)
    depth_sigma_hf_mm: 0.12
    # [가정] 저주파 성분
    depth_sigma_lf_mm: 0.5
    # [실측] 기선 중앙값 0.24 m, 그림자는 가리는 물체의 왼쪽
    projector_baseline_x_m: 0.25
    # [실측 맞춤] 4 px 인접 법선 각도차 중앙값 실측 2.9°
    normals_jitter_deg: 1.8

depth:
  sigma_scale_pow: 2.0           # σ(z) = σ_ref · (z / z_ref)^pow  (삼각측량 방식의 일반적 거리 의존성)
  lowfreq_cells: 40
  cluster_sigma_px: 3.0          # 어두운 영역·스치는 각도 결측을 덩어리로 만드는 블러 반경
  edge_jump_mm: 15               # 깊이 불연속 판정 (3×3 범위)
  edge_drop_prob: 0.0            # [실측] 실측 결측은 그림자 쪽에만 있고 경계 전체에는 없다. 켜면 고립 결측이 실측의 5배 이상이 된다
  edge_dilate_px: 0
  projector_shadow: true
  shadow_tol_px: 0.5             # 프로젝터 열 순서 뒤집힘 허용치
  saturation_level: 250
  saturation_drop_prob: 0.05     # [실측] 포화 픽셀의 결측 비율 0~2% (HDR 이라 포화가 곧 결측은 아님)
  grazing_deg: 85                # 표면 법선과 시선 각이 이 이상 → 결측 후보
  grazing_drop_prob: 0.25        # [가정] 전체 결측률을 맞추는 데 쓴다
  # [실측] 장면 중앙 밝기 대비 상대 밝기 구간별 결측 확률
  #   XL250: 밝기 <15(상대 <0.33) 33~45%, 15~30(0.33~0.67) 7.5% / MR130: 15~30(상대 0.1~0.2) 80~90%
  dark_rel_edges: [0.2, 0.35]
  dark_drop_probs: [0.85, 0.4]     # 상대 0.35 이상에 결측을 주면 실측에 없는 점 무늬가 생긴다
  speckle_drop_prob: 0.0002      # [실측] 4 px 이하 고립 결측 0.01~0.03%

rgb:
  # [가정] RGB 는 아직 실측 교정 안 함
  shot_gain: 0.6                 # Poisson-Gaussian: σ² = shot_gain·I + read_sigma²
  read_sigma: 2.0
  blur_sigma_px: [0.0, 0.7]
  exposure_gain: [0.85, 1.15]
  wb_jitter: 0.04                # 채널별 게인 ± 비율

normals:
  # depth.png 가 mm 정수라 노이즈 depth 에서 법선을 다시 계산하면 계단 잡음이 실측보다 훨씬 커진다
  # (재계산 시 인접 법선 각도차 7~10°, 실측 1.3~2.9°). 그래서 렌더 법선에 작은 흔들림만 준다.
  recompute_from_depth: false
  # 흔들림 크기는 cameras.*.normals_jitter_deg
  jitter_blur_px: 1.0
  missing_dilate_px: 0           # [실측] Zivid normals 는 depth 가 있는 곳엔 거의 다 있다 (추가 결측 0.03~0.3%)
  smooth_px: 2                   # recompute_from_depth: true 일 때만 사용
